# Scrubbed AI desk compose — no house paths or secrets.
# On target: ~/sentinel-ai-desk/docker-compose.yml
services:
  ollama:
    image: ollama/ollama:latest
    container_name: si-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ./data/ollama:/root/.ollama
    # Uncomment when NVIDIA container toolkit is installed and use_gpu: true
    # gpus: all
    # environment:
    #   - NVIDIA_VISIBLE_DEVICES=all
    #   - NVIDIA_DRIVER_CAPABILITIES=compute,utility

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: si-open-webui
    restart: unless-stopped
    ports:
      - "${WEBUI_PORT:-8080}:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_AUTH=False
    depends_on:
      - ollama
    volumes:
      - ./data/open-webui:/app/backend/data
